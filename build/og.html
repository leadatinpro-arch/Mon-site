<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=League+Spartan:wght@600;800&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#03012A;color:#fff;font-family:Arimo,Arial,sans-serif;position:relative}
  .b{position:absolute;border-radius:50%;filter:blur(80px)}
  .b1{width:620px;height:620px;background:#2E6ACB;opacity:.55;right:-160px;top:-220px}
  .b2{width:380px;height:380px;background:#FBDE5A;opacity:.18;left:-120px;bottom:-160px}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:24px 24px}
  .c{position:absolute;left:90px;top:120px;right:90px}
  .logo{font-family:'League Spartan',sans-serif;font-weight:600;font-size:120px;line-height:.9;letter-spacing:-2px}
  .logo span{color:#FBDE5A;font-weight:800}
  .role{font-family:'League Spartan',sans-serif;font-weight:600;font-size:44px;margin-top:34px}
  .role mark{background:none;color:#FBDE5A}
  .sub{font-size:26px;color:#759DD7;margin-top:18px}
  .url{position:absolute;left:90px;bottom:60px;font-family:'League Spartan',sans-serif;font-weight:700;font-size:26px;letter-spacing:.08em;color:#fff;opacity:.8}
</style></head>
<body><div class="b b1"></div><div class="b b2"></div><div class="dots"></div>
<div class="c"><div class="logo">Léa <span>DATIN</span></div>
<div class="role">Cheffe de projet <mark>marketing digital</mark></div>
<div class="sub">ICN Business School · 2 ans chez Saint-Gobain PAM · 12 pays</div></div>
<div class="url">LEA-DATIN.COM</div></body></html>
